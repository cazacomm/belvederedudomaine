name: Blog auto — Le Belvédère du Domaine

on:
  schedule:
    # Tous les lundis à 9h00 UTC (11h en heure d'été française, 10h en hiver).
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : génère l'article mais n'écrit et ne pousse rien"
        type: boolean
        default: false
      rewrite:
        description: "Slug d'un article existant à régénérer (laisser vide pour publier le sujet suivant)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  generate:
    name: Génération et publication d'un article
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Identité git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Réapprovisionnement des sujets
        id: topics
        if: inputs.dry_run != true && inputs.rewrite == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          python scripts/generate-article.py --topics-only
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "Réserve de sujets vérifiée."
          else
            echo "::warning::Réapprovisionnement des sujets en échec (code $code) — on poursuit avec la réserve existante."
          fi

      # Poussé immédiatement : si la rédaction échoue juste après, les sujets
      # déjà produits sont acquis et ne seront pas régénérés au prochain run.
      - name: Push des nouveaux sujets
        if: inputs.dry_run != true && inputs.rewrite == ''
        run: |
          if [ -n "$(git log origin/${GITHUB_REF_NAME}..HEAD --oneline)" ]; then
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "::notice::Nouveaux sujets poussés."
          else
            echo "::notice::Aucun nouveau sujet à pousser."
          fi

      - name: Génération de l'article
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          args=""
          if [ -n "${{ inputs.rewrite }}" ]; then
            args="--rewrite ${{ inputs.rewrite }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/generate-article.py --dry-run $args
          else
            python scripts/generate-article.py $args
          fi
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0)  echo "Article généré." ;;
            78) echo "::notice::Aucun nouveau sujet à traiter — arrêt propre." ;;
            *)  echo "::error::Échec de la génération (code $code)." ; exit $code ;;
          esac

      - name: Commit et push
        if: steps.generate.outputs.exit_code == '0' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Aucune modification à committer."
            exit 0
          fi
          git add -A
          if [ -n "${{ inputs.rewrite }}" ]; then
            msg="chore(blog): reecriture de ${{ inputs.rewrite }}"
          else
            msg="chore(blog): article auto du $(date -u +%Y-%m-%d)"
          fi
          git commit -m "$msg"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "::notice::Article publié et poussé."

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### Blog auto — Le Belvédère du Domaine"
            echo ""
            echo "- Code de sortie du script : \`${{ steps.generate.outputs.exit_code }}\`"
            echo "- Réapprovisionnement des sujets : \`${{ steps.topics.outputs.exit_code || '(ignoré)' }}\`"
            echo "- Simulation : \`${{ inputs.dry_run || 'false' }}\`"
            echo "- Réécriture : \`${{ inputs.rewrite || '(aucune)' }}\`"
            echo ""
            echo "Codes : \`0\` succès · \`78\` aucun sujet restant · \`1\` erreur."
          } >> "$GITHUB_STEP_SUMMARY"
